name: Capture CBS openers
# Every 3 hours, every day. Hosted-runner cron fires hours late (audit 0.10),
# so frequency, not punctuality, is what keeps openers from being missed.
# Each run appends to data/lines/cbs_open_captures.csv (never overwrites).
on:
  schedule:
    - cron: '17 */3 * * *'
    - cron: '7,37 12-21 * * 2'     # Tuesday posting window: every 30 min
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-cbs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e .
      - name: Capture
        run: python -m engine capture-cbs
      - name: Commit captures
        if: always()
        run: |
          git config user.name "nfl-ats-engine"
          git config user.email "nfl-ats-engine@users.noreply.github.com"
          git add data/lines
          git commit -m "lines: CBS capture $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((i*4)); done
