name: Publish dashboard
# Rebuilds the picks dashboard and commits it as site/dashboard.html, which the private Streamlit app shows
# (streamlit_app/app.py, docs/scheduling.md).
# Triggers: the lock run dispatches it after each group of picks; the crons pick up final scores
# (nflverse posts them some time after games end); manual dispatch any time.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * 0'      # Sun ~5:30 PM ET: early games final
    - cron: '30 1 * * 1'       # Sun ~9:30 PM ET: late games final
    - cron: '30 5 * * 1,2,5'   # ~1:30 AM ET after Sun/Mon/Thu night games
    - cron: '0 13 * * 2'       # Tue morning: week wrap-up

permissions:
  contents: write

concurrency:
  group: publish-dashboard
  cancel-in-progress: true     # only the newest build matters

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e .
      - name: Build
        run: python -m engine dashboard --season 2026 --out site/dashboard.html --log-provisional
      - name: Commit
        run: |
          git config user.name "nfl-ats-engine"
          git config user.email "nfl-ats-engine@users.noreply.github.com"
          git add site/dashboard.html data/predictions/provisional_log.csv
          git commit -m "dashboard: rebuild $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((i*3)); done
