name: Publish dashboard
# Rebuilds the picks dashboard and deploys it to GitHub Pages (docs/scheduling.md).
# Triggers: the lock run dispatches it after each group of picks; the crons pick up final scores
# (nflverse posts them some time after games end); manual dispatch any time.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * 0'      # Sun ~5:30 PM ET: early games final
    - cron: '30 1 * * 1'       # Sun ~9:30 PM ET: late games final
    - cron: '30 5 * * 1,2,5'   # ~1:30 AM ET after Sun/Mon/Thu night games
    - cron: '0 13 * * 2'       # Tue morning: week wrap-up

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true     # only the newest build matters

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e .
      - name: Build
        run: |
          mkdir -p site
          python -m engine dashboard --season 2026 --out site/index.html
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
