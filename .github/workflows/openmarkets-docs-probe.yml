name: openmarkets-docs-probe

# One-off read of the public OpenMarkets developer docs and the API root. Unauthenticated GETs only:
# no API key is passed to this job. Prints page text (tags stripped, truncated) and doc-like URLs.
# Runs on a push that changes this file, or when dispatched by hand.
on:
  workflow_dispatch:
  push:
    branches: [claude/nfl-ats-league-engine-q5vkbf]
    paths: ['.github/workflows/openmarkets-docs-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Public docs text (no credentials)
        run: |
          for url in \
            https://app.openmarkets.ai/developers \
            https://app.openmarkets.ai/developers/quickstart \
            https://app.openmarkets.ai/developers/authentication \
            https://app.openmarkets.ai/developers/reference \
            https://app.openmarkets.ai/developers/historical \
            https://app.openmarkets.ai/developers/rate-limits \
            https://api.openmarkets.ai/; do
            out=$(mktemp)
            code=$(curl -sS -L -o "$out" -w '%{http_code}' --max-time 20 "$url" 2>&1 || true)
            echo "=== $url => $code ($(wc -c < "$out") bytes)"
            python3 -I - "$out" <<'PY'
          import html, re, sys
          raw = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          raw = re.sub(r"(?is)<(script|style|noscript)\b.*?</\1>", " ", raw)
          text = re.sub(r"\s+", " ", html.unescape(re.sub(r"(?s)<[^>]+>", " ", raw))).strip()
          print(text[:3500])
          print(f"[{len(text)} chars of visible text; first 3500 shown]")
          urls = sorted(set(re.findall(r"https?://[^\s\"'<>)]+", raw)))
          print("urls:", [u for u in urls if re.search(r"openapi|swagger|api\.openmarkets|/v[0-9]", u, re.I)][:30])
          PY
            rm -f "$out"
          done
