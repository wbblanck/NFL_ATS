name: Fetch ESPN line history
# One-off research download of ESPN's timestamped spread history, 2018-2022 (data/raw/espn_history).
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ['scripts/fetch/espn_line_history.py', '.github/workflows/fetch-espn-history.yml']

permissions:
  contents: write

concurrency:
  group: fetch-espn-history-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python scripts/fetch/espn_line_history.py
      - name: Commit
        run: |
          git config user.name "nfl-ats-engine"
          git config user.email "nfl-ats-engine@users.noreply.github.com"
          git add data/raw/espn_history
          git commit -m "data: ESPN line history 2018-2022" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
