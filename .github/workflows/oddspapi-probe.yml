name: Probe OddsPapi (NFL)
# One-off discovery: NFL ids, spread markets, Pinnacle coverage live and in history
# (scripts/fetch/oddspapi_probe.py -> docs/evidence/probe/*/oddspapi_*). About 7 of the key's
# 250 monthly requests, so workflow_dispatch only: never on push or a schedule.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - run: python scripts/fetch/oddspapi_probe.py
        env:
          ODDSPAPI_API_KEY: ${{ secrets.ODDS_PAPI }}
      - name: Commit
        if: always()
        run: |
          git config user.name "nfl-ats-engine"
          git config user.email "nfl-ats-engine@users.noreply.github.com"
          if [ -d docs/evidence/probe ]; then git add docs/evidence/probe; fi
          git commit -m "evidence: OddsPapi NFL probe" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
