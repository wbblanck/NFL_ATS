name: Fetch SBRO archive
# One-off download of historical NFL open/close lines (SBRO, 2007-08..2021-22).
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ['scripts/fetch/sbro.py', '.github/workflows/fetch-sbro.yml']

permissions:
  contents: write

concurrency:
  group: fetch-sbro-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python scripts/fetch/sbro.py
      - name: Commit
        run: |
          git config user.name "nfl-ats-engine"
          git config user.email "nfl-ats-engine@users.noreply.github.com"
          git add data/raw/sbro
          git commit -m "data: SBRO raw season pages" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
