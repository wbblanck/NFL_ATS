name: Audit probe
# Phase 0 evidence gathering on a hosted runner (open internet). Commits raw
# responses to docs/evidence/probe/<UTC stamp>/.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]   # evidence probes run from work branches, not on merge
    paths: ['scripts/audit/network_probe.py', '.github/workflows/audit-probe.yml']

permissions:
  contents: write

concurrency:
  group: audit-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Probe
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/audit/network_probe.py
      - name: Commit evidence
        run: |
          git config user.name "nfl-ats-engine"
          git config user.email "nfl-ats-engine@users.noreply.github.com"
          git add docs/evidence/probe
          git commit -m "audit: network probe evidence" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
