name: Audit render
# Renders client-side pages (headless Chromium) listed in scripts/audit/render_urls.txt
# and commits their text to docs/evidence/rendered/.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]   # evidence probes run from work branches, not on merge
    paths: ['scripts/audit/render_urls.txt', 'scripts/audit/render_pages.py', '.github/workflows/audit-render.yml']

permissions:
  contents: write

concurrency:
  group: audit-render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python scripts/audit/render_pages.py
      - name: Commit evidence
        run: |
          git config user.name "nfl-ats-engine"
          git config user.email "nfl-ats-engine@users.noreply.github.com"
          git add docs/evidence/rendered
          git commit -m "audit: rendered page evidence" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
