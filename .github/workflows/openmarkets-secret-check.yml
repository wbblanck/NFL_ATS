name: openmarkets-secret-check

# One-off check: shows whether this repo's Actions runs can see the OpenMarkets secret.
# Prints yes/no per secret and never prints a value. Runs only when dispatched by hand.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENMARKETS_API_KEY: ${{ secrets.OPENMARKETS_API_KEY }}
      PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}  # control: a secret the pipeline already reads
    steps:
      - name: Presence check (no values printed)
        run: |
          for v in OPENMARKETS_API_KEY PARLAY_API_KEY; do
            if [ -n "${!v}" ]; then
              echo "$v: visible to this run"
            else
              echo "$v: NOT visible (missing, or the name differs)"
            fi
          done
