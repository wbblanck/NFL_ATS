name: Lock run (final picks)
# Triggered by an EXTERNAL timer via the workflow_dispatch API (see docs/scheduling.md).
# GitHub's own cron starts hours late (audit 0.10); dispatch started in seconds
# (measured 2026-09-25: request 03:41:46Z -> job 03:41:54Z -> capture 03:42:14Z).
on:
  workflow_dispatch:
    inputs:
      window_minutes:
        description: 'Pick games whose lock is within this many minutes'
        default: '25'
      game_id:
        description: 'Manual fallback: pick this one game now (optional)'
        default: ''
      wait:
        description: 'Wait and pick each lock group lead_minutes before its lock (true/false)'
        default: 'false'
      lead_minutes:
        description: 'With wait: minutes before lock (kickoff - 15) to capture the market and pick'
        default: '5'

permissions:
  contents: write
  actions: write       # dispatch publish-dashboard.yml after each group of picks

concurrency:
  group: lock-run-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e .
      - name: Final picks
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "nfl-ats-engine"
          git config user.email "nfl-ats-engine@users.noreply.github.com"
          commit() {
            git add data/predictions data/lines
            git commit -m "picks: lock run $(date -u +%Y-%m-%dT%H:%MZ)" || return 0
            for i in 1 2 3 4; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && return 0; sleep $((i*3)); done
            return 1
          }
          # Phone alert for the picks written since $1 (ISO, +00:00); never fails the run. No-op without NTFY_TOPIC.
          notify() {
            python -m engine alert --local --send --since "$1" || true
            gh workflow run publish-dashboard.yml --ref "${GITHUB_REF_NAME}" || echo "dashboard publish not dispatched"
          }
          now_iso() { date -u +%Y-%m-%dT%H:%M:%S+00:00; }
          if [ -n "${{ inputs.game_id }}" ]; then
            T0=$(now_iso)
            python -m engine run --game "${{ inputs.game_id }}"
            notify "$T0"
          elif [ "${{ inputs.wait }}" = "true" ]; then
            # One lock group per pass: wait, pick at lock - lead, commit, repeat until the window is empty.
            for pass in 1 2 3 4 5 6 7 8; do
              T0=$(now_iso)
              python -m engine lock-run --wait --window-minutes "${{ inputs.window_minutes || '25' }}" \
                --lead-minutes "${{ inputs.lead_minutes || '5' }}" | tee pass.log || echo "pass $pass failed; retrying"
              commit
              notify "$T0"
              grep -q "^REMAINING 0" pass.log && break
            done
          else
            T0=$(now_iso)
            python -m engine lock-run --window-minutes "${{ inputs.window_minutes || '25' }}"
            notify "$T0"
          fi
      - name: Grade finished games (live record)
        if: always()
        run: python -m engine grade || true
      - name: Commit predictions
        if: always()
        run: |
          git config user.name "nfl-ats-engine"
          git config user.email "nfl-ats-engine@users.noreply.github.com"
          git add data/predictions data/lines
          git commit -m "picks: lock run $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((i*3)); done
