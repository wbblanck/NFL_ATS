}

.chatbot-toast-container.toast-error{
    background-color : var(--lwc-colorBackgroundError) !important;
}

 .chatbot-toast-container.toast-warning{
    background-color : var(--lwc-colorBackgroundWarning) !important;
} 

.chatbot-toast-container.toast-info{
    background-color : var(--lwc-colorBackgroundInfo) !important;
}

.messageArea .chatSessionStartTime {
    color: black !important;
}

.embeddedServiceHelpButton .flatButton{
    background-color: unset !important;
    background-size: cover !important;
    background-image: url(/sfsites/c/resource/ChatStartLogo) !important;
    background-repeat: no-repeat !important;
    background-position: center center !important;
    outline: none !important;
    position: absolute !important;
    right: 0px !important;
    bottom: 0px !important;
    width: 64px !important;
    height: 64px !important;
    border-radius: 50% !important;
    border: 0px !important;
    padding: 0px !important;
    animation: 0.75s ease 0s 5 normal none running customBounce !important;
}

.embeddedServiceHelpButton .embeddedServiceIcon,.embeddedServiceHelpButton .helpButtonLabel{
    display : none !important;
}

.close-announcement svg {
    fill:white;
}

@-webkit-keyframes customBounce {
    0% {
        bottom: 5px;
    }

    25%,
    75% {
        bottom: 15px;
    }

    50% {
        bottom: 20px;
    }

    100% {
        bottom: 0;
    }
}


/* FOOTER */
.footer-container {
    padding: 40px 1.75rem;
    max-width: 1440px;
    margin: 0 auto;
}
.footer-pipe-divider {
    margin: 0 .75rem;
    color: var(--lwc-colorTextWeak);
}
.footer-copyright {
    margin-top: 1rem;
    color: var(--lwc-colorTextWeak);
}

/* BREADCRUMB */
.breadcrumb-chevron svg {
    width: .65rem;
}
.back-home-link {
    color: rgb(12, 29, 182) !important;
    font-size: .75rem;
    text-transform: uppercase;
    font-weight: bold;
}

/* RESPONSIVE OVERRIDES */
@media only screen and (max-width: 47.9375em) {
    .forceCommunityHeadline .headlineTitle {
        font-size: 1.5rem !important;
        padding-top: .75rem !important;
    }
    .cPLSearchResultsContainer .search-term-title .boldText {
        font-size: 2.25rem;
    }
}

/* Close Modal on Quick Answers */
.slds-modal__close{
    width:auto !important;
}

/* Anchor Spacing */
.anchorSpacing{
  display: block;
  height: 115px; /*same height as header*/
  margin-top: -115px; /*same height as header*/
  visibility: hidden;
}
