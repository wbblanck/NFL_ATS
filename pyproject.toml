[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-ats-engine"
version = "0.1.0"
description = "Picks every NFL regular-season game against a frozen CBS Sports opening spread."
requires-python = ">=3.11"
dependencies = [
  "polars>=1.0",
  "pyarrow>=15",
  "duckdb>=1.0",
  "numpy>=1.26",
  "pyyaml>=6",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "nflreadpy>=0.1.5",
]

[project.optional-dependencies]
# Modeling stack (Phase 2+). Not needed for Phase 0/1 capture jobs.
model = ["scipy>=1.11", "statsmodels>=0.14", "scikit-learn>=1.4"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
