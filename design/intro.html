<div id="stage">

<script>
(function(){
'use strict';
const NS='http://www.w3.org/2000/svg';
const DUR=5, CX=960, CY=540;
const C={ground:'#070C18',panel:'#0E1628',panel2:'#16213A',ink:'#F4F6F8',ink2:'#9AA4B2',amber:'#FFB020',green:'#2FCB7A',red:'#F0524A'};

/* ---------- easing, written as functions of time ---------- */
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,t0,d)=>clamp((t-t0)/d);
const K0=Math.pow(2,-10);
const eOut=x=>{x=clamp(x);return (1-Math.pow(2,-10*x))/(1-K0)};          // exponential out
const eIn=x=>{x=clamp(x);return (Math.pow(2,10*(x-1))-K0)/(1-K0)};       // exponential in
const eIO=x=>{x=clamp(x);return x<.5?eIn(2*x)/2:.5+eOut(2*x-1)/2};       // exponential in-out
function spring(tt,f=3,z=.78,dur=.9){                                      // critically-ish damped spring step
  if(tt<=0)return 0; if(tt>=dur)return 1;
  const w=2*Math.PI*f, wd=w*Math.sqrt(1-z*z);
  return 1-Math.exp(-z*w*tt)*(Math.cos(wd*tt)+z*w/wd*Math.sin(wd*tt));
}
const spd=(fn,t,h=1/120)=>(fn(t)-fn(t-h))/h;   // backward difference: velocity over the shutter, zero on the first frame of a move
const hex=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));
const mix=(a,b,t)=>{const A=hex(a),B=hex(b);return '#'+A.map((v,i)=>Math.round(lerp(v,B[i],clamp(t))).toString(16).padStart(2,'0')).join('')};

/* ---------- svg helpers ---------- */
const svg=document.getElementById('svg');
const mk=(tag,at,parent)=>{const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);if(parent)parent.appendChild(e);return e;};
const set=(e,o)=>{for(const k in o)e.setAttribute(k,o[k]);};
const show=(e,v)=>{e.style.display=v?'':'none'};
const defs=mk('defs',{},svg);
let blurN=0;
function mkBlur(){const id='bl'+(blurN++);const f=mk('filter',{id,filterUnits:'userSpaceOnUse',x:-700,y:-700,width:3320,height:2480,'color-interpolation-filters':'sRGB'},defs);const g=mk('feGaussianBlur',{stdDeviation:'0 0'},f);return {id,g};}
let K=1; // playback speed of the refresh cut (blur follows output-time velocity)
function blur(target,b,sx,sy){
  sx=Math.min(sx*K,70);sy=Math.min(sy*K,70);
  if(sx<.5&&sy<.5){target.removeAttribute('filter');return;}
  b.g.setAttribute('stdDeviation',sx.toFixed(2)+' '+sy.toFixed(2));target.setAttribute('filter','url(#'+b.id+')');
}
function mkClip(){const id='cp'+(blurN++);const cp=mk('clipPath',{id},defs);const r=mk('rect',{},cp);return {id,r};}

/* ---------- rounded rectangle sampled by arclength, starts at left-middle going up ---------- */
function rrPoint(s,w,h,r,cx,cy,rot){
  r=Math.min(r,w/2,h/2);
  const sx=w-2*r, sy=h-2*r, q=Math.PI*r/2;
  const seg=[sy/2,q,sx,q,sy,q,sx,q,sy/2];
  let P=0;for(const a of seg)P+=a;
  let d=(s-Math.floor(s))*P, x,y,i=0;
  while(i<8&&d>seg[i]){d-=seg[i];i++;}
  const arc=(ax,ay,th0)=>{const th=th0+(seg[i]?d/seg[i]:0)*Math.PI/2;x=ax+r*Math.cos(th);y=ay+r*Math.sin(th);};
  switch(i){
    case 0:x=-w/2;y=-d;break;
    case 1:arc(-sx/2,-sy/2,Math.PI);break;
    case 2:x=-sx/2+d;y=-h/2;break;

          const w=lerp(118,15*shr,mp), h=lerp(bh,86*shr,mp);
          const sdef=(el,rot)=>set(el,{x:(p[0]-w/2).toFixed(2),y:(p[1]-h/2).toFixed(2),width:Math.max(0,w).toFixed(2),height:Math.max(0,h).toFixed(2),rx:Math.min(7,Math.max(0,w/2)),'fill-opacity':1,'stroke-width':0,transform:'rotate('+rot.toFixed(2)+' '+p[0].toFixed(2)+' '+p[1].toFixed(2)+')'});
          sdef(b.ma,45*mp); sdef(b.mb,-45*mp); show(b.mb,true);
        }
        const vx=Math.abs(spd(x=>markXY(i,x)[0],t))*.0011, vy=Math.abs(spd(x=>markXY(i,x)[1],t))*.0011;
        blur(b.mg,b.blm,vx,vy);
      }
      // letters burst up out of the ground line when the ball lands
      const ti=4.5+.035*Math.abs(i-2.5);
      const off=x=>(CAPH+90)*(1-spring(x-ti,5.5,.8,.34));
      const lOn=t>=4.5; show(b.lg,lOn);
      if(lOn){
        const cw=Lc.w/2+14, top=BASE-CAPH-60;
        set(b.gc.r,{x:(cx-cw).toFixed(2),width:(2*cw).toFixed(2),y:top,height:(GY-8)-top});
        set(b.gl,{x:cx.toFixed(2),y:(BASE+off(t)).toFixed(2)});
        blur(b.lg,b.blg,0,Math.abs(spd(off,t))*.0011);
      }
    });
    // the ball: pops out of the pile-up at the line of scrimmage and drops onto the ground line
    const ballPos=x=>{
      const u=clamp((x-4.0)/.5), yL=GY-2-29;
      return [lerp(PC[0],CX,u), lerp(PC[1],yL,u)-4*290*u*(1-u), 20-720*u];
    };
    const bOn=t>=4.0&&t<4.58; show(ballG,false); bcv.style.display=bOn?'':'none';
    if(bOn){
      const p=ballPos(t), pop=spring(t-4.0,4,.8,.3);
      const bump=Math.sin(clamp(prog(t,4.5,.12))*Math.PI), shr=1-eOut(prog(t,4.5,.07));
      const k=pop*shr*1.6;
      const u=clamp((t-4.0)/.5), roll=p[2]-20, spin=900*u;          // tumbles end over end while spiralling about its long axis
      if(SYNC)renderBall(roll,spin); else if(!drawLive(u))bcv.style.display='none';
      const sc=.52*k;
      bcv.style.transform='translate('+(p[0]-100).toFixed(2)+'px,'+(p[1]-100).toFixed(2)+'px) scale('+(sc*(1+.35*bump)).toFixed(4)+','+(sc*(1-.35*bump)).toFixed(4)+')';
      const q=ballPos(t-1/120), sp2=Math.hypot(p[0]-q[0],p[1]-q[1])*120*.0009;
      bcv.style.filter=sp2>.4?'blur('+sp2.toFixed(2)+'px)':'none';
    }
  } else { show(ballG,false); bcv.style.display='none'; }
  svg.style.display='';
  show(gS1,true);
  if(s3){ /* svg layers are idle during the 3D shot */ }
}
window.seek=seek;window.renderBall=renderBall;
/* 2 s refresh cut: the 5 s piece from 1.0 s on, at 2x speed (one bar = the four scene changes, one per beat). u in [0,2). */
window.seekCut=u=>{K=2;seek(1+2*u);K=1;};

function boot(){
  measure();initCols();initBars();
  if(!SYNC)startLive();
  window.__ready=true;
  seek(0);
  addEventListener('message',e=>{const d=e.data;if(d&&typeof d.seek==='number')seek(d.seek);});   // the dashboard drives the clock
  if(parent!==window)parent.postMessage({introReady:1},'*');
  const h=location.hash;
  const fit=()=>{const k=Math.min(innerWidth/1920,innerHeight/1080);const st=document.getElementById('stage');st.style.transform='scale('+k+')';st.style.left=((innerWidth-1920*k)/2)+'px';st.style.top=((innerHeight-1080*k)/2)+'px';};
  if(!/render/.test(h)){fit();addEventListener('resize',fit);}
  if(/play/.test(h)){const t0=performance.now();const f=now=>{seek(((now-t0)/1000)%DUR);requestAnimationFrame(f);};requestAnimationFrame(f);}
}
document.fonts.load('900 100px Inter').then(()=>document.fonts.load('600 30px Inter')).then(boot);
})();
</script>
